name: Type Check

on:
  pull_request:
    branches: [main]

# See test.yml: Node-based actions need the runner's system CA store to get
# through the TLS-intercepting proxy.
env:
  NODE_OPTIONS: --use-system-ca

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy src/
