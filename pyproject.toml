[project]
name = "automl-model-training"
version = "0.1.0"
description = "AutoML training and prediction pipeline built on AutoGluon — train, evaluate, explain, and predict from a single CLI"
readme = "README.md"
authors = [
    { name = "Aniket Braganza", email = "aabragan@amazon.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "autogluon>=1.6.1",
    "shap>=0.45.0",
    "openai>=1.0.0",
    "optuna>=4.0.0",
    "tabpfn-client>=0.3.3",
]

[project.scripts]
train = "automl_model_training.train:main"
train-binary = "automl_model_training.train:train_binary"
train-regression = "automl_model_training.train:train_regression"
predict = "automl_model_training.predict:main"
predict-binary = "automl_model_training.predict:predict_binary"
predict-regression = "automl_model_training.predict:predict_regression"
backtest = "automl_model_training.backtest:main"
profile = "automl_model_training.profile:main"
experiments = "automl_model_training.experiment:main"
compare = "automl_model_training.compare:main"
agent-binary = "automl_model_training.agent:agent_binary"
agent-regression = "automl_model_training.agent:agent_regression"
agent-ollama = "automl_model_training.ollama_agent:main"

[project.optional-dependencies]
# AutoGluon 1.6 `extreme` preset — commercial-free foundation models:
# Nori, TabICLv2, TabDPT-Turbo (+ TabPrep LightGBM, included in base). GPU strongly recommended.
extreme = [
    "autogluon.tabular[all,nori,tabicl,tabdpt]>=1.6.1",
]
# `noncommercial` preset — everything in extreme plus TabPFN-3.
# TabPFN-3 is free for research and internal experimentation; commercial use
# requires a license from Prior Labs (https://docs.priorlabs.ai/models#tabpfn-model-license).
noncommercial = [
    "autogluon.tabular[all,nori,tabicl,tabdpt,tabpfn]>=1.6.1",
]
# Full TabArena lineup — everything above plus RealMLP and the legacy
# TabPFNv2/Mitra models used by the `tabarena` and `extreme_v150` presets.
tabarena = [
    "autogluon.tabular[tabarena]>=1.6.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.0",
    "coverage>=7.13.5",
    "pytest-cov>=7.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Integration tests are opt-in via the "slow" marker. They train real AutoGluon
# models against sample data and cache artifacts in tests/integration/_cache/.
# Default invocation (`pytest tests/`) deselects them to keep the feedback loop
# tight. Run explicitly with `pytest -m slow tests/integration/` or via
# `uv run pytest -m slow`.
markers = [
    "slow: integration test that trains real AutoGluon models (deselected by default)",
]
addopts = "-m 'not slow'"
